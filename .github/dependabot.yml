# Mises à jour de dépendances : une PR groupée par semaine et par domaine, au
# plus 3 PR ouvertes à la fois, pour ne pas inonder le dépôt.
# Chaque PR passe la CI normale ; rien n'est fusionné ni déployé automatiquement.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      api-python: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /audiobook
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      audiobook-python: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      web-npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /audiobook
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    labels: [dependencies]
