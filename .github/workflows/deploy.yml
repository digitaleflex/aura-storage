name: Auto-Deployment Zéro Downtime

# Manual only. This job opens an SSH session on the production VPS and runs
# scripts/deploy.sh, so it must never fire on a merge: a merge to main would
# ship code that has not passed acceptance on the pilot (docs/DEPLOYMENT.md).
# Start it deliberately from the Actions tab ("Run workflow") once the
# validation workflow is green and the backup/restore gate is satisfied.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Execute Zero-Downtime Deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Fail the workflow when the remote script fails. Without this,
          # appleboy/ssh-action reports success even when bootstrap aborts
          # (it did: npm was missing from the non-interactive PATH and every
          # "successful" deploy since then never rebuilt the frontend).
          script_stop: true
          # The build runs on the host, whose non-interactive SSH shell does not
          # load the Node version manager profile.
          command_timeout: 25m
          script: |
            cd /home/aura-admin/aura-storage
            export PATH="/home/aura-admin/.node/v22/bin:$PATH"
            command -v npm >/dev/null || { echo "ERROR: npm still missing from PATH"; exit 1; }
            node --version
            npm --version
            echo "🚀 Début déploiement $(date)"
            bash scripts/deploy.sh
            echo "✅ Déploiement terminé $(date)"