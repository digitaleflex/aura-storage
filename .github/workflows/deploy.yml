name: Auto-Deployment Zéro Downtime

# Manual only. This job opens an SSH session on the production VPS and runs
# scripts/deploy.sh, so it must never fire on a merge: a merge to main would
# ship code that has not passed acceptance on the pilot (docs/DEPLOYMENT.md).
# Start it deliberately from the Actions tab ("Run workflow") once the
# validation workflow is green and the backup/restore gate is satisfied.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Execute Zero-Downtime Deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Fail the workflow when the remote script fails: scripts/deploy.sh
          # starts with `set -Eeuo pipefail`, so the first failing step exits
          # non-zero and ssh-action reports the job as failed. The former
          # `script_stop` input was removed from appleboy/ssh-action (v1.2.x)
          # and is ignored; GitHub flags it as an unexpected input.
          # The build runs on the host, whose non-interactive SSH shell does not
          # load the Node version manager profile.
          command_timeout: 25m
          # The remote script never updated its checkout: a deploy shipped
          # whatever commit the server already had (2026-11-23: c536609 went
          # out instead of the merged b328ed0, so a CSP fix stayed offline).
          # The commit this run was started on is now fetched and fast-forwarded
          # to, and the deploy aborts if the checkout does not end up on it.
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail
            cd /home/aura-admin/aura-storage
            git fetch --quiet origin main
            git merge --ff-only "$DEPLOY_SHA"
            [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "ERROR: checkout is not at $DEPLOY_SHA"; exit 1; }
            echo "Commit deploye : $(git log -1 --format='%h %s')"
            export PATH="/home/aura-admin/.node/v22/bin:$PATH"
            command -v npm >/dev/null || { echo "ERROR: npm still missing from PATH"; exit 1; }
            node --version
            npm --version
            echo "🚀 Début déploiement $(date)"
            bash scripts/deploy.sh
            echo "✅ Déploiement terminé $(date)"