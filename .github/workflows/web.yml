name: CI Tests (PR)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # The web dependencies live in web/ (web/package-lock.json). Run there:
      # `npm ci` at the repository root had no lockfile to install from
      # and failed every run, so the PR gate was red on every branch.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Run frontend unit tests
        run: npm run test:unit
        working-directory: web
      - name: Install API test dependencies
        run: python3 -m pip install -r api/requirements-dev.txt
      - name: Run API tests
        run: |
          AURA_API_ADMIN_PASSWORD=ci-dummy-password \
          AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
          AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 \
          AURA_S3_ENDPOINT=https://127.0.0.1:9 \
          AURA_API_DB=:memory: AURA_COOKIE_SECURE=0 \
          python3 -m pytest tests/ -q --timeout=45

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install API test dependencies
        run: python3 -m pip install -r api/requirements-dev.txt
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run end-to-end tests
        run: |
          set -e
          AURA_API_ADMIN_PASSWORD=local-smoke-test-password \
          AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
          AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 \
          AURA_S3_ENDPOINT=https://127.0.0.1:9 \
          AURA_API_DB=:memory: AURA_COOKIE_SECURE=0 \
          python3 -m uvicorn api.main:app --host 127.0.0.1 --port 8081 --workers 1 &
          API_PID=$!
          cd web
          npm run dev &
          VITE_PID=$!
          cd ..
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/health/live >/dev/null && break; sleep 1; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          cd web
          npx playwright test
          EXIT=$?
          kill $API_PID $VITE_PID 2>/dev/null || true
          exit $EXIT
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-results
          path: web/test-results
