name: Web app and API image

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install -r ../api/requirements.txt
      - name: Type-check and build (what deploy.sh ships)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start API (SQLite, dummy S3) and Vite dev server
        # Same setup as web/README.md: never points at real storage.
        run: |
          cd ..
          AURA_API_ADMIN_PASSWORD=local-smoke-test-password \
          AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
          AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 \
          AURA_S3_ENDPOINT=https://127.0.0.1:9 AURA_S3_INTERNAL_ENDPOINT=https://127.0.0.1:9 \
          AURA_API_DB=:memory: AURA_COOKIE_SECURE=0 AURA_AUDIT_LOG=/tmp/aura-e2e-audit.jsonl \
            nohup python3 -m uvicorn api.main:app --host 127.0.0.1 --port 8081 >/tmp/api.log 2>&1 &
          cd web && nohup npx vite >/tmp/vite.log 2>&1 &
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:5173/health/live >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/api.log /tmp/vite.log
          exit 1
      - name: Playwright end-to-end suite
        run: npx playwright test --reporter=line
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image deploy.sh builds
        run: docker build -t aura-api:ci ./api
      - name: Image boots and answers its liveness probe
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e AURA_API_ADMIN_PASSWORD=ci-dummy-password \
            -e AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
            -e AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 \
            -e AURA_API_DB=/tmp/ci.db -e AURA_COOKIE_SECURE=0 aura-api:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
