name: Quality

# Filet de qualité (docs/engineering/QUALITE.md). Deux contrôles BLOQUANTS
# (`lint-python`, `lint-web`) qui ne portent que sur ce qui passe déjà ; tout le
# reste est un AVERTISSEMENT compté dans le résumé du run, jamais un échec.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python3 -m pip install ruff==0.17.6 mypy==2.4.1 -r api/requirements.txt
      # Bloquant : règles de pyproject.toml (vrais défauts, 0 cas aujourd'hui).
      - name: Ruff (blocking rules)
        run: ruff check api audiobook scripts tests
      # Avertissement : compte par règle, pour suivre la réduction de la dette.
      - name: Ruff (advisory, counts per rule)
        continue-on-error: true
        run: |
          {
            echo "### Ruff — avertissements (non bloquants)"
            echo '```'
            ruff check api audiobook scripts tests \
              --select F401,F841,B008,B904,B017,B018,E731,UP,SIM,PLW \
              --exit-zero --statistics
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: mypy (advisory)
        continue-on-error: true
        run: |
          {
            echo "### mypy — avertissements (non bloquants)"
            echo '```'
            mypy || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  lint-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      # Bloquant sur les erreurs (dont l'ordre des hooks React) et sur toute
      # AUGMENTATION du nombre d'avertissements (plafond dans web/package.json).
      - name: ESLint
        run: npm run lint
        working-directory: web

  # Informatif : jamais bloquant.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          python3 -m pip install pip-audit==2.10.1
          {
            echo "### pip-audit — vulnérabilités connues (non bloquant)"
            echo '```'
            pip-audit -r api/requirements.txt -r audiobook/requirements.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Web dependencies (npm audit)
        continue-on-error: true
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          {
            echo "### npm audit — vulnérabilités élevées ou critiques (non bloquant)"
            echo '```'
            npm audit --omit=dev --audit-level=high || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Informatif : couverture des tests API, sans seuil pour l'instant.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install -r api/requirements-dev.txt -r audiobook/requirements.txt
      - name: API tests with coverage (advisory)
        continue-on-error: true
        run: |
          AURA_API_ADMIN_PASSWORD=ci-dummy-password \
          AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
          AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 \
          AURA_S3_ENDPOINT=https://127.0.0.1:9 \
          AURA_API_DB=:memory: AURA_COOKIE_SECURE=0 \
          python3 -m pytest tests/ -q --timeout=45 \
            --cov=api --cov=audiobook --cov-report=term:skip-covered \
            | tee coverage.txt
          {
            echo "### Couverture des tests API (non bloquant, sans seuil)"
            echo '```'
            tail -n 40 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
