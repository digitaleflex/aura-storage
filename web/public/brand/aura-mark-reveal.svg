<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AURA Vault — Reveal">
  <!-- Phase 1 — A2 « Reveal » : le A se révèle par couches, pour états de transfert. -->
  <defs>
    <linearGradient id="re-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10203a"/>
      <stop offset="1" stop-color="#060d1a"/>
    </linearGradient>
    <radialGradient id="re-glow">
      <stop offset="0" stop-color="#2e7cf6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2e7cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="re-top"><rect x="0" y="10" width="64" height="17"/></clipPath>
    <clipPath id="re-mid"><rect x="0" y="27" width="64" height="11"/></clipPath>
    <clipPath id="re-bot"><rect x="0" y="38" width="64" height="26"/></clipPath>
  </defs>
  <style>
    @keyframes aura-reveal {
      0%, 10% { opacity: .18; }
      35%, 80% { opacity: 1; }
      100% { opacity: .18; }
    }
    .rv-top { animation: aura-reveal 3s ease-in-out infinite; }
    .rv-mid { animation: aura-reveal 3s ease-in-out infinite .45s; }
    .rv-bot { animation: aura-reveal 3s ease-in-out infinite .9s; }
    @media (prefers-reduced-motion: reduce) {
      .rv-top, .rv-mid, .rv-bot { animation: none; opacity: .9; }
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#re-tile)" stroke="#1a2f52"/>
  <circle cx="32" cy="32" r="28" fill="url(#re-glow)"/>
  <path d="M53.7 44.5 A25 25 0 1 1 44.5 10.4" fill="none" stroke="#2e7cf6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="44.5" cy="10.4" r="3.2" fill="#c5f441"/>
  <g fill="#dbe4f3">
    <path class="rv-top" clip-path="url(#re-top)" d="M32 14 L50 50 H41 L32 27 L23 50 H14 Z"/>
    <path class="rv-mid" clip-path="url(#re-mid)" d="M32 14 L50 50 H41 L32 27 L23 50 H14 Z"/>
    <path class="rv-bot" clip-path="url(#re-bot)" d="M32 14 L50 50 H41 L32 27 L23 50 H14 Z"/>
  </g>
  <rect x="19" y="38" width="26" height="4.6" rx="2.3" fill="#c5f441"/>
</svg>
