name: aura-storage

services:
  traefik:
    image: ${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aura-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
      - --ping=true
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The Traefik dashboard is enabled internally but is NOT routed publicly by this baseline.
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.traefik-dashboard.rule=Host(`${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=dash-auth
      - traefik.http.middlewares.dash-auth.basicauth.users=${DASHBOARD_AUTH:?Set DASHBOARD_AUTH in .env}
      # Port 8080 is never published to the host; the dashboard is reachable only
      # through this HTTPS router with BasicAuth (bcrypt).

  seaweed-master:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-master
    restart: unless-stopped
    command:
      - master
      - -ip=seaweed-master
      - -ip.bind=0.0.0.0
      - -mdir=/data
      - -volumeSizeLimitMB=${SEAWEED_VOLUME_SIZE_LIMIT_MB:-30000}
    volumes:
      - ${AURA_DATA_DIR:-./data}/master:/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true

  seaweed-volume:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-volume
    restart: unless-stopped
    command:
      - volume
      - -master=seaweed-master:9333
      - -ip=seaweed-volume
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -port=8080
      - -max=${SEAWEED_VOLUME_MAX:-0}
    volumes:
      - ${AURA_DATA_DIR:-./data}/volume:/data
    networks:
      - storage
    depends_on:
      seaweed-master:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  seaweed-filer:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-filer
    restart: unless-stopped
    command:
      - filer
      - -master=seaweed-master:9333
      - -ip=seaweed-filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      # SeaweedFS SSE-S3 envelope-encryption key. Keep identical across all S3 gateways.
      WEED_S3_SSE_KEK: ${WEED_S3_SSE_KEK:?Set a 64-character hex WEED_S3_SSE_KEK in .env}
    volumes:
      - ${AURA_DATA_DIR:-./data}/filer:/data
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - storage
      - edge
    depends_on:
      seaweed-master:
        condition: service_started
      seaweed-volume:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-s3.rule=Host(`${S3_DOMAIN:?Set S3_DOMAIN in .env}`)
      - traefik.http.routers.aura-s3.entrypoints=websecure
      - traefik.http.routers.aura-s3.tls=true
      - traefik.http.routers.aura-s3.tls.certresolver=le
      - traefik.http.services.aura-s3.loadbalancer.server.port=8333
    security_opt:
      - no-new-privileges:true
    # No SeaweedFS master/volume/filer admin ports are published to the host.

networks:
  edge:
    name: aura-edge
  storage:
    name: aura-storage-internal
    internal: true

volumes:
  traefik-acme:
