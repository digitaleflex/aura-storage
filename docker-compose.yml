name: aura-storage

services:
  traefik:
    image: ${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aura-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
      - --ping=true
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The Traefik dashboard is enabled internally but is NOT routed publicly by this baseline.
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.traefik-dashboard.rule=Host(`${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=dash-auth
      - traefik.http.middlewares.dash-auth.basicauth.users=${DASHBOARD_AUTH:?Set DASHBOARD_AUTH in .env}
      # Port 8080 is never published to the host; the dashboard is reachable only
      # through this HTTPS router with BasicAuth (bcrypt).

  seaweed-master:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-master
    restart: unless-stopped
    command:
      - master
      - -ip=seaweed-master
      - -ip.bind=0.0.0.0
      - -mdir=/data
      - -volumeSizeLimitMB=${SEAWEED_VOLUME_SIZE_LIMIT_MB:-30000}
    volumes:
      - ${AURA_DATA_DIR:-./data}/master:/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true

  seaweed-volume:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-volume
    restart: unless-stopped
    command:
      - volume
      - -master=seaweed-master:9333
      - -ip=seaweed-volume
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -port=8080
      - -max=${SEAWEED_VOLUME_MAX:-0}
    volumes:
      - ${AURA_DATA_DIR:-./data}/volume:/data
    networks:
      - storage
    depends_on:
      seaweed-master:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  seaweed-filer:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-filer
    restart: unless-stopped
    command:
      - filer
      - -master=seaweed-master:9333
      - -ip=seaweed-filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      # SeaweedFS SSE-S3 envelope-encryption key. Keep identical across all S3 gateways.
      WEED_S3_SSE_KEK: ${WEED_S3_SSE_KEK:?Set a 64-character hex WEED_S3_SSE_KEK in .env}
    volumes:
      - ${AURA_DATA_DIR:-./data}/filer:/data
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - storage
      - edge
    depends_on:
      seaweed-master:
        condition: service_started
      seaweed-volume:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-s3.rule=Host(`${S3_DOMAIN:?Set S3_DOMAIN in .env}`)
      - traefik.http.routers.aura-s3.entrypoints=websecure
      - traefik.http.routers.aura-s3.tls=true
      - traefik.http.routers.aura-s3.tls.certresolver=le
      - traefik.http.services.aura-s3.loadbalancer.server.port=8333
    security_opt:
      - no-new-privileges:true
    # No SeaweedFS master/volume/filer admin ports are published to the host.

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aura} -d $${POSTGRES_DB:-aura}"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No host ports published: catalogue DB reachable only on the internal network.

  api:
    build: ./api
    image: aura-api:local
    container_name: ${AURA_INSTANCE_ID:-aura-001}-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      AURA_API_ADMIN_USER: ${AURA_API_ADMIN_USER:-admin}
      AURA_API_ADMIN_PASSWORD: ${AURA_API_ADMIN_PASSWORD:?Set AURA_API_ADMIN_PASSWORD in .env}
      AURA_S3_ENDPOINT: https://${S3_DOMAIN:?Set S3_DOMAIN in .env}
      AURA_S3_INTERNAL_ENDPOINT: http://seaweed-filer:8333
      AURA_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AURA_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AURA_API_BACKEND: postgres
      AURA_API_DSN: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aura}
      AURA_TRUSTED_ORIGINS: https://${S3_DOMAIN:?Set S3_DOMAIN in .env}
      AURA_COOKIE_SECURE: "1"
    networks:
      - storage
    depends_on:
      postgres:
        condition: service_healthy
      seaweed-filer:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    # No host ports, no Traefik route: reachable only via the app proxy.

  app:
    image: nginx:1.28.3-alpine
    container_name: ${AURA_INSTANCE_ID:-aura-001}-app
    restart: unless-stopped
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - storage
      - edge
    depends_on:
      api:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-app.rule=Host(`${S3_DOMAIN:?Set S3_DOMAIN in .env}`) && PathPrefix(`/app`)
      - traefik.http.routers.aura-app.entrypoints=websecure
      - traefik.http.routers.aura-app.tls=true
      - traefik.http.routers.aura-app.tls.certresolver=le
      - traefik.http.routers.aura-app.middlewares=app-strip
      - traefik.http.middlewares.app-strip.stripprefix.prefixes=/app
      - traefik.http.services.aura-app.loadbalancer.server.port=80
    security_opt:
      - no-new-privileges:true
    # Only 80/443 via Traefik (shared entrypoints); no direct ports published.

networks:
  edge:
    name: aura-edge
  storage:
    name: aura-storage-internal
    internal: true

volumes:
  traefik-acme:
  pgdata:
