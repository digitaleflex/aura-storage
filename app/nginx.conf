# AURA app frontend (static SPA + same-origin /api proxy to the api service).
server {
  listen 80;
  server_name _;

  # Do not advertise the nginx version.
  server_tokens off;

  root /usr/share/nginx/html;

  # The bundle is a single 460 kB JS file; without compression it crossed the
  # wire whole (3.2x larger than gzip). Vary keeps caches honest.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Security headers for the app shell (API sets its own).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # ${S3_DOMAIN} is substituted at container start (nginx image templates).
  # connect-src: same-origin API + direct presigned PUTs to the S3 host.
  # Inline preview (images, audio, PDF) loads short-lived presigned GETs from the
  # S3 host only: img-src (images), media-src (audio and video) and frame-src (PDF). The
  # API serves only allow-listed types inline (never HTML/SVG/XML), and
  # frame-ancestors/X-Frame-Options still forbid framing the app itself.
  # style-src keeps 'unsafe-inline' for runtime style attributes; scripts stay
  # 'self' only. HSTS is set by Traefik (middleware aura-hsts).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://${S3_DOMAIN}; font-src 'self'; connect-src 'self' https://${S3_DOMAIN}; media-src 'self' https://${S3_DOMAIN}; frame-src https://${S3_DOMAIN}; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Content-hashed bundles can be cached forever; index.html must never be.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback. Traefik strips the /app prefix before forwarding,
  # so nginx always sees root-relative paths here.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  # Public share links (`/s/<token>`). The `aura-share` Traefik router sends
  # these straight to the API (priority 200, never through the SPA); this
  # location is the fallback that keeps links alive if that router is ever
  # dropped, instead of letting the SPA fallback answer index.html. Tokens and
  # redirects stay in the API (302 to a presigned S3 URL); nginx only forwards.
  location /s/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Published media (`/m/<slug>`) and pack manifests (`/p/<slug>.json`): same
  # routing as share links, permanent URLs owned by the API.
  location /p/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hls/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /m/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Commit may hash up to 5 GiB synchronously; allow long responses.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # A commit hashes up to AURA_MAX_OBJECT_BYTES (5 GiB) inside the API request,
  # so it can answer after minutes; the nginx default (60 s) would cut the
  # response first and hide the API's own outcome (#120). Regex location: it
  # takes precedence over the /api/ prefix above, so only this route gets the
  # long idle timeout. Kept slightly above AURA_COMMIT_DEADLINE_S (300 s) so the
  # API's structured 504 -- which marks the upload intent failed -- wins the
  # race against nginx's generic 504 (which would leave it pending); if you
  # raise the deadline, raise these two values with it.
  location ~ ^/api/v1/objects/[^/]+/commit$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
  }

  location = /health {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # Diagnostic réseau : le corps est volontairement gros (5 Mo) et doit
  # parvenir à l'API en flux, sinon nginx le bufferise sur disque et la mesure
  # ne dit plus rien du lien. Exact match : seule cette route est concernée.
  location = /api/v1/diag/upload {
    client_max_body_size 26m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
