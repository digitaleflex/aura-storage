# AURA app frontend (static SPA + same-origin /api proxy to the api service).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Security headers for the app shell (API sets its own).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # SPA fallback. Traefik strips the /app prefix before forwarding,
  # so nginx always sees root-relative paths here.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }
}
