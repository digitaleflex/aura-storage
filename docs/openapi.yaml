openapi: 3.1.0
info:
  title: AURA Management API
  version: 0.2.0
  description: |
    Implemented contract for the AURA Management API (`api/main.py`). Bytes never
    pass through the API: clients upload/download directly to S3 through short-lived
    presigned URLs. Object keys and buckets are chosen server-side.

    Human callers authenticate with the `aura_session` cookie; mutating calls must
    also send the session CSRF token in `X-CSRF-Token`. Machine callers authenticate
    with a Bearer service-identity token. Authorization is server-side and default-deny;
    see `docs/AUTHORIZATION-MATRIX.md`.

    Identifiers are canonical UUID v4 values (`docs/DATA-MODEL.md`); a malformed
    identifier in a path, query parameter or request body is refused with 422.

    **Where to call it.** The API has no public hostname of its own. Production
    traffic reaches it through the app proxy: `https://<APP_DOMAIN>/api/v1/...`.
    The documentation host serves the same API same-origin at `/api/v1/...`,
    behind a source allow-list and a BasicAuth credential, which is what makes
    "Try it" work with no CORS configuration. The API never emits
    `Access-Control-Allow-*`, so a browser call from any other origin is blocked
    by design — machine callers should use curl or a Bearer token instead.

    **Access to this documentation.** `docs.aura-storage.eurinhash.com` is not
    public: the router admits an operator IP allow-list first, then requires the
    BasicAuth credential. "Try it" performs real mutations against the catalogue,
    so point it at disposable objects only.

    Validated by the offline contract tests in CI (`tests/test_openapi_contract.py`)
    and exercised on the pilot VPS; each release records what was actually
    observed in `docs/verification-log-*.md`.
servers:
  # Same-origin first: on the docs host, "Try it" then works with no CORS and
  # keeps the session cookie + CSRF header same-origin.
  - url: /
    description: >-
      Same origin as this documentation UI. Preferred when browsing the docs
      host: requests go to /api/v1/... on the same host, behind the docs
      allow-list and credential.
  - url: https://app.aura-storage.eurinhash.com
    description: >-
      App host (production entry point). Cross-origin from the docs host, so
      browser calls are blocked: use curl or a machine (Bearer) token.
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes — public and unauthenticated.
  - name: auth
    description: Human session lifecycle — login, logout, principal introspection.
  - name: objects
    description: >-
      Object catalogue and transfer intents. Bytes never pass through the API:
      every upload and download is a short-lived presigned S3 URL.
  - name: folders
    description: >-
      Logical folders in the catalogue. Folders never change the storage layout;
      they are an organisational view over the same objects.
  - name: platform
    description: >-
      Platform registry — applications, spaces and buckets. Creating tenancy
      requires `admin:write`, which a machine identity can never hold.
  - name: identities
    description: >-
      Machine-to-machine identities (Bearer tokens) with explicit, minimal object
      scopes, plus rotation and immediate revocation.
  - name: administration
    description: >-
      Operator and administrator reads — statistics, usage, audit search and
      retention, orphan inspection, stale-intent reconciliation.
paths:
  /health/live:
    get:
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      summary: Readiness probe
      tags: [health]
      security: []
      responses:
        "200": { description: Dependencies ready }
        "503": { description: Not ready }
  /api/v1/login:
    post:
      summary: Create a human session (public, rate-limited)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              human:
                summary: Sign in as a human operator
                value: { username: admin, password: REPLACE_WITH_THE_ACCOUNT_PASSWORD }
      responses:
        "200":
          description: Returns the CSRF token; sets the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                success:
                  summary: Store csrf_token in memory; the cookie is HttpOnly
                  value: { csrf_token: 6Qk2m0oT1s9Vx3rB4nJ8wA }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /api/v1/logout:
    post:
      summary: Delete the current session (human only)
      tags: [auth]
      responses:
        "200": { description: Logged out }
        "401": { description: Authentication required }
        "403": { description: CSRF validation failed }
  /api/v1/me:
    get:
      summary: Introspect the current principal
      tags: [auth]
      responses:
        "200":
          description: >-
            Principal metadata (kind, role, scopes, space, application). For a
            human session, `csrf_token` re-exposes the token issued at login so
            the client can recover it after a refresh without a new login; it is
            always `null` for service (Bearer) principals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
              examples:
                humanSession:
                  value:
                    id: 3f1c2a94-6d0b-4a7e-9f52-1b8c0d4e77aa
                    kind: user
                    name: admin
                    role: admin
                    space_id: 8b2e5f10-73c9-4d61-a0f4-2c9d6e8b1a37
                    application_id: 5c7d9e20-1a4b-4f83-9d62-7e0b3a5c8f41
                    scopes: [admin:read, admin:write, objects:delete, objects:purge, objects:read, objects:write]
                    csrf_token: 6Qk2m0oT1s9Vx3rB4nJ8wA
                serviceIdentity:
                  value:
                    id: 1d4e6f80-2b7a-4c35-8e91-6a3f0b2d5c79
                    kind: service
                    name: ingest-worker
                    role: service
                    space_id: 8b2e5f10-73c9-4d61-a0f4-2c9d6e8b1a37
                    application_id: 5c7d9e20-1a4b-4f83-9d62-7e0b3a5c8f41
                    scopes: [objects:read, objects:write]
                    csrf_token: null
        "401": { description: Authentication required }
  /api/v1/me/master-mode:
    post:
      summary: Enter master mode on this session (objects:purge, human only)
      tags: [auth]
      description: >-
        Short, password-confirmed elevation for bulk destructive actions, bound
        to this browser session and audited. The current password is re-verified
        here; failures count towards the same per-IP login rate limit as
        /api/v1/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024, format: password }
      responses:
        "200":
          description: Master mode active until master_until (epoch seconds)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterModeState" }
              examples:
                elevated:
                  value: { master_until: 1761130500 }
        "401": { description: Authentication required }
        "403": { description: "Password does not match, CSRF validation failed, or a service identity (human-only capability)" }
        "422": { description: Missing or empty password }
        "429": { description: Too many failed attempts from this client; see Retry-After }
    delete:
      summary: Leave master mode on this session (any authenticated caller)
      tags: [auth]
      responses:
        "200":
          description: Master mode cleared for this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterModeState" }
              examples:
                cleared:
                  value: { master_until: null }
        "401": { description: Authentication required }
        "403": { description: Service identities have no session to clear (human-only) }
  /api/v1/objects:
    get:
      summary: List objects visible to the caller
      tags: [objects]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Negative values are clamped to 0 (never 422)
        - in: query
          name: folder_id
          schema: { type: string }
          description: >-
            Optional catalogue filter (#62): the literal "root" returns objects
            not filed in any folder; a canonical uuid returns that folder's
            objects. A malformed value is refused with 422.
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
          description: >-
            Case-insensitive display-name substring (M02). Never matches the
            internal object key; a blank value is ignored.
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, available, deleted, expired, failed, aborted]
          description: Exact catalogue status.
        - in: query
          name: content_type
          schema: { type: string, maxLength: 127 }
          description: Exact media type, compared case-insensitively.
        - in: query
          name: min_size
          schema: { type: integer, minimum: 0 }
          description: Minimum committed size in bytes (pending rows still carry size -1).
        - in: query
          name: max_size
          schema: { type: integer, minimum: 0 }
          description: Maximum committed size in bytes.
        - in: query
          name: created_after
          schema: { type: integer, minimum: 0 }
          description: Inclusive lower bound on creation time (epoch seconds).
        - in: query
          name: created_before
          schema: { type: integer, minimum: 0 }
          description: Inclusive upper bound on creation time (epoch seconds).
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at, display_name, size_bytes]
            default: created_at
          description: Sort key; ties break on id so OFFSET paging stays stable.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
      responses:
        "200":
          description: >-
            Page of object metadata. Each item carries folder_id, created_at and
            updated_at; internal storage coordinates (bucket, object_key) are
            never returned. Soft-deleted rows are hidden unless status=deleted
            is passed explicitly.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ObjectSummary" }
              examples:
                page:
                  summary: One committed object, unfiled (root)
                  value:
                    items:
                      - id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                        display_name: contrat-2026.pdf
                        content_type: application/pdf
                        size_bytes: 482133
                        expected_size_bytes: 482133
                        checksum_sha256: 9f2c41a7d0b8e6534c1f9a2b7d8e0c3f5a6b9d2e8c1f4a7b0d3e6c9f2a5b8d1e
                        checksum_algorithm: sha256
                        status: available
                        folder_id: null
                        created_at: 1761129600
                        updated_at: 1761129650
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "422": { description: "Malformed folder_id, or an unsupported status/sort/order value" }
  /api/v1/objects/bulk-purge:
    post:
      summary: Purge many objects in one call (objects:purge, human only, master mode)
      tags: [objects]
      description: >-
        Master mode is required: without it the call is refused with 403, so a
        stolen session cannot mass-delete. At most AURA_MASTER_BULK_MAX (500 by
        default) ids per call. Ids are canonicalized one by one; a malformed id
        is reported in not_found instead of failing the whole call. A storage
        delete failure is reported in failed and keeps the catalogue row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: Object ids to purge; malformed ids are reported in not_found
      responses:
        "200":
          description: Per-id outcome; every requested id appears in exactly one list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPurgeResult" }
              examples:
                mixed:
                  value:
                    purged: [7c63c78d-d790-498e-acb5-870d53cfc0fd]
                    not_found: [not-an-object-id]
                    failed: []
        "401": { description: Authentication required }
        "403": { description: "Not authorised, or master mode is not active" }
        "422": { description: "Empty id list, or more ids than the per-call cap" }
  /api/v1/objects/trash/empty:
    post:
      summary: Purge the caller's whole trash in one call (objects:purge, human only, master mode)
      tags: [objects]
      description: >-
        Master mode is required (403 otherwise). Purges at most
        AURA_MASTER_BULK_MAX soft-deleted objects per call and sets `more` when
        the trash still holds rows: the client simply calls again.
      responses:
        "200":
          description: Per-id outcome plus `more` when soft-deleted rows remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPurgeResult" }
              examples:
                emptied:
                  value:
                    purged: [7c63c78d-d790-498e-acb5-870d53cfc0fd]
                    not_found: []
                    failed: []
                    more: false
        "401": { description: Authentication required }
        "403": { description: "Not authorised, or master mode is not active" }
  /api/v1/objects/upload-intents:
    post:
      summary: Create a short-lived upload intent (capability objects:write)
      tags: [objects]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
          description: >-
            Optional opaque key. A repeated request carrying the same key and
            actor returns the same pending intent (idempotent_replay=true) with a
            freshly signed URL instead of creating a second object. Refused with
            422 if empty, over-long or containing control characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadIntentRequest" }
            examples:
              pdf:
                summary: Declare a 482 KB PDF; the response carries the presigned PUT
                value: { display_name: contrat-2026.pdf, content_type: application/pdf, size_bytes: 482133 }
      responses:
        "200":
          description: Upload intent (id, status, method, presigned upload_url, required headers, content_type, size_bytes, expiry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadIntent" }
              examples:
                created:
                  summary: PUT the bytes to upload_url with exactly these headers
                  value:
                    id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                    status: pending
                    method: PUT
                    upload_url: https://aura-storage.eurinhash.com/spaces/aura/objects/7c63c78d-d790-498e-acb5-870d53cfc0fd/x-amz-signature-redacted
                    headers:
                      Content-Type: application/pdf
                      x-amz-server-side-encryption: AES256
                    content_type: application/pdf
                    size_bytes: 482133
                    expires_in: 900
                    expires_at: 1761130500
                    idempotent_replay: false
        "401": { description: Authentication required }
        "403": { description: Bucket not allowed / not authorised }
        "422": { description: "Invalid request, disallowed content type, or empty/size over the cap" }
        "429": { description: Too many pending uploads }
  /api/v1/objects/{oid}/commit:
    post:
      summary: Validate an upload, stream SHA-256, mark available (objects:write)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Object available with checksum_sha256 (algorithm sha256); idempotent on repeat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
              examples:
                committed:
                  value:
                    id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                    status: available
                    size_bytes: 482133
                    checksum_sha256: 9f2c41a7d0b8e6534c1f9a2b7d8e0c3f5a6b9d2e8c1f4a7b0d3e6c9f2a5b8d1e
                    checksum_algorithm: sha256
                    commit_timing:
                      head_ms: 12.481
                      hash_ms: 87.203
                      total_ms: 101.917
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: Object not committable (including aborted/expired/deleted) }
        "410": { description: Upload intent expired }
        "413": { description: Object exceeds the maximum allowed size }
        "422": { description: Upload missing or size mismatch }
  /api/v1/objects/{oid}/abort:
    post:
      summary: Cancel a pending upload intent (objects:write)
      tags: [objects]
      description: >-
        Best-effort deletes the partial bytes and marks the intent aborted.
        Idempotent for an already aborted/expired intent; a committed (available)
        or deleted object is refused with 409. This is the only cancellation the
        UI uses — cancellation is not offered where the backend does not support it.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Intent aborted (or already in a terminal pending state) }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: Object not abortable }
  /api/v1/objects/{oid}/multipart:
    get:
      summary: Multipart upload status — plan and parts already held (objects:write)
      tags: [objects]
      description: >-
        Lets a resumed upload send only the missing parts. The plan is computed
        server-side from the declared size; uploaded_parts lists the part numbers
        the backend already holds at the planned size.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Part plan and the part numbers already stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartStatus" }
              examples:
                resumed:
                  value:
                    id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                    size_bytes: 52428800
                    part_size_bytes: 8388608
                    part_count: 7
                    uploaded_parts: [1, 2, 3]
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: No multipart upload in progress for this object }
        "410": { description: "Upload intent expired, or the multipart upload no longer exists" }
        "422": { description: Identifier is not a canonical UUID v4 }
        "502": { description: Storage unavailable; the held parts cannot be listed }
  /api/v1/objects/{oid}/multipart/parts:
    post:
      summary: Presign PUT URLs for requested multipart parts (objects:write)
      tags: [objects]
      description: >-
        Returns one short-lived presigned PUT per requested part number (at most
        100 per call), each bound to the exact byte length of that part. Part
        numbers are deduplicated and sorted. PUT the bytes directly to the URL;
        the API never proxies them.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [part_numbers]
              properties:
                part_numbers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Presigned part URLs with the exact size each part must carry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartPartBatch" }
              examples:
                firstTwo:
                  value:
                    id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                    expires_in: 900
                    parts:
                      - part_number: 1
                        size_bytes: 8388608
                        url: https://aura-storage.eurinhash.com/spaces/aura/objects/7c63c78d-d790-498e-acb5-870d53cfc0fd?partNumber=1&x-amz-signature-redacted
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: No multipart upload in progress for this object }
        "410": { description: "Upload intent expired, or the multipart upload no longer exists" }
        "422": { description: "Identifier is not a canonical UUID v4, or a part number is out of range" }
  /api/v1/objects/{oid}:
    get:
      summary: Get object metadata
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object metadata (size_bytes is -1 until verified; expected_size_bytes carries the declared size) }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
    patch:
      summary: File or unfile an object in a logical folder (objects:write, human only)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [folder_id]
              properties:
                folder_id: { $ref: "#/components/schemas/Uuid4", nullable: true, description: Folder owned by the caller; null unfiles the object (root level) }
      responses:
        "200": { description: Object metadata with its new folder_id }
        "401": { description: Authentication required }
        "404": { description: Object or target folder not found or not visible }
        "422": { description: "No fields supplied, or malformed folder id" }
    delete:
      summary: Soft-delete an object (objects:delete)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object marked deleted }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: Object not deletable }
  /api/v1/objects/{oid}/restore:
    post:
      summary: Restore a soft-deleted object from the trash (objects:delete)
      tags: [objects]
      description: >-
        Same capability as the delete it reverses. Only a committed object can
        come back: a soft-deleted pending intent never received its bytes and is
        refused.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Object available again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectSummary" }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: "Object is not in the trash, or was never uploaded" }
        "422": { description: Identifier is not a canonical UUID v4 }
  /api/v1/objects/{oid}/share:
    post:
      summary: Mint a public read-only share link (objects:read, human only)
      tags: [objects]
      description: >-
        Human-only on purpose: a leaked machine token must not be able to mint
        unauthenticated links. Everything is bounded server-side — expiry, an
        optional use ceiling and the content type allowed to render inline; the
        token is returned exactly once and only its SHA-256 fingerprint is
        stored. The link is redeemed outside this API root, at GET /s/{token}.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in:
                  type: integer
                  minimum: 60
                  description: Seconds of validity; omitted = AURA_SHARE_TTL_DEFAULT, above AURA_SHARE_TTL_MAX is refused with 422
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Burn-after-N-read ceiling; omitted = unlimited
                content_disposition:
                  type: string
                  enum: [attachment, inline]
                  default: attachment
                  description: Inline is refused with 422 for active document types
      responses:
        "200":
          description: Share created; the token is returned once and never stored in clear text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectShareCreated" }
              examples:
                publicLink:
                  value:
                    id: 0b5f7e2a-9c41-4d63-8f10-2a7b6c5d9e43
                    object_id: 7c63c78d-d790-498e-acb5-870d53cfc0fd
                    url: /s/aura_share_9f2c41a7d0b8e653
                    token: aura_share_9f2c41a7d0b8e653
                    expires_in: 604800
                    expires_at: 1761734400
                    max_uses: 5
                    content_disposition: attachment
        "401": { description: Authentication required }
        "403": { description: "Not authorised, or a service identity (human-only capability)" }
        "404": { description: Object not found or not visible }
        "409": { description: Object not available }
        "422": { description: "Identifier is not a canonical UUID v4, expiry above the maximum, inline for a non-renderable type, or an invalid body field" }
  /api/v1/objects/{oid}/shares:
    get:
      summary: List the share links of an object (objects:read)
      tags: [objects]
      description: >-
        Never returns the tokens themselves; `active` is computed server-side
        from expiry, use count and revocation so a client never re-implements
        the rules.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Share links created for the object (never the tokens)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ObjectShare" }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "422": { description: Identifier is not a canonical UUID v4 }
  /api/v1/objects/{oid}/shares/{sid}:
    delete:
      summary: Revoke a share link immediately (objects:read, human only, creator only)
      tags: [objects]
      description: >-
        Idempotent: revoking an already revoked link returns the original
        revoked_at and never rewrites it. Only the creator may revoke; any other
        caller gets 403.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/ShareId"
      responses:
        "200":
          description: Link revoked (or already revoked)
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id: { $ref: "#/components/schemas/Uuid4" }
                  revoked: { type: boolean, enum: [true] }
                  revoked_at: { type: integer, description: Epoch seconds of the original revocation }
        "401": { description: Authentication required }
        "403": { description: Not the creator of this share link }
        "404": { description: "Object or share not found, or the share belongs to another object" }
        "422": { description: Identifier is not a canonical UUID v4 }
  /api/v1/objects/{oid}/download-intent:
    post:
      summary: Create a short-lived download intent (objects:read)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Presigned GET URL plus display_name, content_type, size_bytes and checksum_sha256 for progress/verification display" }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: Object not available }
  /api/v1/objects/{oid}/preview-intent:
    post:
      summary: Create a short-lived inline-preview intent (objects:read)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Presigned GET URL bound to Content-Disposition inline and the object content type, plus display_name, content_type and size_bytes; the client falls back to a download when the type is not renderable" }
        "401": { description: Authentication required }
        "404": { description: Object not found or not visible }
        "409": { description: Object not available }
  /api/v1/objects/{oid}/purge:
    post:
      summary: Permanently delete an object (objects:purge, operator/admin)
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object purged }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "404": { description: Object not found or not visible }
        "502": { description: Storage delete failed; the catalogue reference is kept }
  /api/v1/folders:
    get:
      summary: List folders owned by the caller (objects:read, human only)
      tags: [folders]
      parameters:
        - in: query
          name: parent_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Return the children of this folder; omitted = root level
        - in: query
          name: all
          schema: { type: boolean, default: false }
          description: >-
            When true, return the caller's whole folder tree as a flat list
            (each item still carries parent_id) in a single request. Cannot be
            combined with parent_id (refused with 422).
      responses:
        "200": { description: "Folders directly under the requested parent, or the full flat tree when all=true" }
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "404": { description: Parent folder not found or not visible }
        "422": { description: all combined with parent_id }
    post:
      summary: Create a logical folder (objects:write, human only)
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderCreateRequest" }
            examples:
              root:
                summary: Folder at the root level
                value: { name: Contrats 2026 }
              nested:
                summary: Child of an existing folder
                value: { name: Signés, parent_id: 0d1f7b3c-9a2e-4e58-b6d7-2f8c1a4e6b90 }
      responses:
        "200":
          description: Folder created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
              examples:
                created:
                  value:
                    id: 0d1f7b3c-9a2e-4e58-b6d7-2f8c1a4e6b90
                    name: Contrats 2026
                    parent_id: null
                    created_at: 1761129600
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "404": { description: Parent folder not found or not visible }
        "409": { description: "Duplicate name at this level, or depth limit reached" }
        "422": { description: Invalid folder name }
  /api/v1/folders/{fid}:
    get:
      summary: Get folder metadata (objects:read, human only)
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200": { description: Folder metadata }
        "401": { description: Authentication required }
        "404": { description: Folder not found or not visible }
    patch:
      summary: Rename or move a folder (objects:write, human only)
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one of name/parent_id; parent_id null moves the folder to the root
              properties:
                name: { type: string, minLength: 1, maxLength: 255, nullable: true }
                parent_id: { $ref: "#/components/schemas/Uuid4", nullable: true }
      responses:
        "200": { description: Folder updated }
        "401": { description: Authentication required }
        "404": { description: Folder or target parent not found or not visible }
        "409": { description: "Duplicate name, cycle, or depth limit reached" }
        "422": { description: "No fields supplied, or invalid name" }
    delete:
      summary: Delete an empty folder (objects:delete, human only)
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200": { description: Folder deleted }
        "401": { description: Authentication required }
        "404": { description: Folder not found or not visible }
        "409": { description: Folder is not empty }
  /api/v1/admin/reconcile:
    post:
      summary: Expire stale pending uploads (admin:write)
      tags: [administration]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: Bounded sweep, oldest first; repeat until expired is 0 (server clamps to 1..5000)
      responses:
        "200": { description: "Reconcile counts (expired, storage_deletes_attempted, storage_failures); failed storage deletes keep the intent pending" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/reconcile-terminal:
    post:
      summary: Delete bytes of terminal rows past retention (admin:write)
      tags: [administration]
      description: >-
        Sweeps failed, aborted and soft-deleted rows older than the 7-day
        retention, across every space. A row is dropped only after its bytes were
        actually deleted; a storage failure keeps it for a later sweep and is
        counted in storage_failures.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: Rows inspected per terminal status (server clamps to 1..5000)
      responses:
        "200":
          description: "Cleaned rows, storage deletes attempted and storage failures"
          content:
            application/json:
              schema:
                type: object
                required: [cleaned, storage_deletes_attempted, storage_failures]
                properties:
                  cleaned: { type: integer }
                  storage_deletes_attempted: { type: integer }
                  storage_failures: { type: integer }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/reconcile-reverse:
    post:
      summary: Reverse sweep — storage keys with no catalogue row (admin:write)
      tags: [administration]
      description: >-
        Lists the `aura/` prefix in every registered bucket and reports keys the
        catalogue does not account for. Dry-run by default; with dry_run=false
        the orphan keys are deleted. At most 500 keys are inspected per bucket.
      parameters:
        - in: query
          name: dry_run
          schema: { type: boolean, default: true }
          description: When false, delete the reported orphan keys
      responses:
        "200":
          description: "Scan counts, up to 50 orphan keys with their size, deletions and failures"
          content:
            application/json:
              schema:
                type: object
                required: [scanned, orphans, orphan_keys, deleted, failures, dry_run]
                properties:
                  scanned: { type: integer }
                  orphans: { type: integer, description: Number of orphan keys found }
                  orphan_keys:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      properties:
                        bucket: { type: string }
                        key: { type: string }
                        size: { type: integer }
                  deleted: { type: integer }
                  failures: { type: integer }
                  dry_run: { type: boolean }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/integrity:
    get:
      summary: Scrub results and the objects at fault (admin:read)
      tags: [administration]
      description: >-
        `mismatch` means the stored bytes no longer match the SHA-256 verified at
        import; `missing` means storage lost the object. Both call for a restore
        from backup — nothing is changed automatically.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Problem rows returned (server clamps to 1..500)
      responses:
        "200":
          description: "Scrub interval, counts per result with the oldest sweep time, and problem rows"
          content:
            application/json:
              schema:
                type: object
                required: [interval_days, results, problems]
                properties:
                  interval_days: { type: integer, description: Configured AURA_SCRUB_INTERVAL_DAYS }
                  results:
                    type: object
                    description: Keyed by scrub result (ok, mismatch, missing, error, unchecked)
                    additionalProperties:
                      type: object
                      required: [count]
                      properties:
                        count: { type: integer }
                        oldest: { type: [integer, "null"], description: Oldest scrubbed_at for this result }
                  problems:
                    type: array
                    items:
                      type: object
                      required: [id, space_id, display_name, size_bytes, scrub_result]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid4" }
                        space_id: { $ref: "#/components/schemas/Uuid4" }
                        display_name: { type: string }
                        size_bytes: { type: integer }
                        scrub_result: { type: string, enum: [mismatch, missing] }
                        scrubbed_at: { type: [integer, "null"] }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/integrity/scrub:
    post:
      summary: Run one bounded scrub pass now (admin:write)
      tags: [administration]
      description: >-
        Same byte budget as the periodic pass. Verification stops early on a
        storage error rather than hammering the backend.
      responses:
        "200":
          description: Per-result counts and bytes read during this pass
          content:
            application/json:
              schema:
                type: object
                required: [ok, mismatch, missing, error, bytes]
                properties:
                  ok: { type: integer }
                  mismatch: { type: integer }
                  missing: { type: integer }
                  error: { type: integer }
                  bytes: { type: integer, description: Bytes read this pass }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/stats:
    get:
      summary: Aggregate counts (admin:read)
      tags: [administration]
      responses:
        "200":
          description: Counts by status/application/space/identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
              examples:
                snapshot:
                  value:
                    objects_by_status: { available: 1284, deleted: 17, pending: 3 }
                    applications: 2
                    spaces: 5
                    buckets: 6
                    service_identities: 4
                    active_service_identities: 3
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/audit:
    get:
      summary: Search the audit log newest-first (admin:read)
      tags: [administration]
      parameters:
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Inclusive lower bound on event time (epoch seconds)
        - in: query
          name: until
          schema: { type: integer, minimum: 0 }
          description: Inclusive upper bound on event time (epoch seconds)
        - in: query
          name: actor
          schema: { type: string, maxLength: 200 }
          description: Substring match on the actor (username or identity id)
        - in: query
          name: action
          schema: { type: string, maxLength: 100 }
          description: Exact action name (e.g. login, upload-intent, admin.reconcile)
        - in: query
          name: result
          schema: { type: string, maxLength: 50 }
          description: Exact result (e.g. success, failure, rate_limited)
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Events attributed to this space (post-authentication events only)
        - in: query
          name: application_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Events attributed to this application (post-authentication events only)
        - in: query
          name: request_id
          schema: { type: string, maxLength: 128 }
          description: Exact request correlation id (also returned as X-Request-Id)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Server clamps out-of-range values to 1..500 (never 422)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Negative values are clamped to 0 (never 422)
      responses:
        "200": { description: "Matching events newest-first (items, total in window, truncated flag, scanned lines, retention_days, queried_at)" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "422": { description: "Malformed id, or since exceeding until" }
  /api/v1/admin/audit/prune:
    post:
      summary: Drop audit lines older than the retention window (admin:write)
      tags: [administration]
      description: >-
        Enforces AURA_AUDIT_RETENTION_DAYS (default 90). Lines without a valid
        timestamp are kept, so audit data is never deleted silently.
      responses:
        "200": { description: "Prune counts (kept, dropped, cutoff, retention_days); a missing log file yields zeros" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "503": { description: Audit log rewrite failed (the file itself is still readable) }
  /api/v1/admin/orphans:
    get:
      summary: Read-only orphan candidates, available rows missing at storage (admin:read)
      tags: [administration]
      description: >-
        Candidates only — nothing is ever deleted on this signal alone, since a
        transient outage also produces candidates. Bounded scan, oldest first.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
          description: Rows scanned (server clamps to 1..1000)
      responses:
        "200": { description: "Checked count, candidate rows and check time" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/storage-orphans:
    get:
      summary: Storage bytes the catalogue does not account for (admin:read)
      tags: [administration]
      description: >-
        Read-only and non-destructive: only registered buckets are scanned and
        nothing is deleted here. Bounded per call (`max_keys` per bucket) and
        resumable by passing the returned `next_start_after` back. A bucket that
        cannot be listed is reported with an `error` instead of failing the whole
        call.
      parameters:
        - in: query
          name: bucket
          schema: { type: string, maxLength: 63 }
          description: Restrict the scan to one registered bucket; omitted = every bucket
        - in: query
          name: start_after
          schema: { type: string, maxLength: 1024 }
          description: Resume after this key (the previous response's next_start_after)
        - in: query
          name: max_keys
          schema: { type: integer, minimum: 1, maximum: 50000, default: 5000 }
          description: Keys scanned per bucket (server clamps to 1..50000)
      responses:
        "200":
          description: "Grace window, per-bucket report with orphan keys and stale multipart uploads"
          content:
            application/json:
              schema:
                type: object
                required: [grace_seconds, buckets, checked_at]
                properties:
                  grace_seconds: { type: integer, description: AURA_ORPHAN_GRACE_SECONDS applied before a key is reported }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [bucket]
                      properties:
                        bucket: { type: string }
                        error: { type: string, description: Present when the bucket could not be listed }
                        scanned: { type: integer }
                        orphans:
                          type: array
                          items:
                            type: object
                            required: [key, size_bytes, last_modified, reason]
                            properties:
                              key: { type: string }
                              size_bytes: { type: integer }
                              last_modified: { type: integer, description: Epoch seconds }
                              reason: { type: string, description: Why the key is unaccounted for }
                              object_id: { type: [string, "null"], description: Catalogue row id when the row exists but is not available }
                        orphan_bytes: { type: integer }
                        next_start_after: { type: [string, "null"], description: Resume cursor; null when the bucket was fully scanned }
                        stale_uploads:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              upload_id: { type: string }
                              initiated: { type: integer }
                              object_id: { type: [string, "null"] }
                  checked_at: { type: integer }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "404": { description: Bucket not registered }
  /api/v1/admin/storage-orphans/cleanup:
    post:
      summary: Remove listed orphan keys and abort listed uploads (admin:write)
      tags: [administration]
      description: >-
        Destructive and explicit: only the listed keys and uploads are touched,
        and each item is re-checked just before acting (still unaccounted for,
        older than the grace window, inside the AURA key prefix). Anything else is
        skipped with a reason. At most 100 keys and 100 uploads per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bucket]
              properties:
                bucket: { type: string, minLength: 1, maxLength: 63 }
                keys:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 1024 }
                uploads:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [key, upload_id]
                    properties:
                      key: { type: string, minLength: 1, maxLength: 1024 }
                      upload_id: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: Removed keys, aborted upload ids and skipped items with their reason
          content:
            application/json:
              schema:
                type: object
                required: [removed, aborted_uploads, skipped]
                properties:
                  removed: { type: array, items: { type: string } }
                  aborted_uploads: { type: array, items: { type: string } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [key, reason]
                      properties:
                        key: { type: string }
                        reason: { type: string }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "404": { description: Bucket not registered }
        "422": { description: "Empty bucket name, or more than 100 keys/uploads" }
  /api/v1/admin/usage:
    get:
      summary: Real consumption per space plus configured limits (admin:read)
      tags: [administration]
      description: >-
        Verified bytes count available objects only; measured_at is the live
        query time. No bandwidth or capacity figures exist — see
        docs/OBSERVABILITY.md.
      parameters:
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Restrict to one space; omitted = every space plus totals
      responses:
        "200": { description: "Limits, totals and per-space usage (bytes are verified available bytes)" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "404": { description: Space not found }
        "422": { description: Identifier is not a canonical UUID v4 }
  /api/v1/admin/health:
    get:
      summary: Supervision snapshot for api, database, storage and disk (admin:read)
      tags: [administration]
      description: >-
        Always 200 with per-component ok/down statuses; top-level degraded when
        any dependency fails. The storage check proves S3 reachability, not a
        full upload/download round-trip.
      responses:
        "200": { description: "Component statuses, recent non-success audit events, operator notes" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/applications:
    post:
      summary: Register an application (admin:write)
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
      responses:
        "200": { description: Application created }
        "401": { description: Authentication required }
        "409": { description: Application already exists }
    get:
      summary: List applications (admin:read)
      tags: [platform]
      responses:
        "200": { description: Applications }
        "401": { description: Authentication required }
  /api/v1/admin/spaces:
    post:
      summary: Create a space and its default bucket (admin:write)
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, name, environment]
              properties:
                application_id: { $ref: "#/components/schemas/Uuid4" }
                name: { type: string, minLength: 1, maxLength: 63 }
                environment: { type: string, minLength: 1, maxLength: 32 }
                default_bucket: { type: string, maxLength: 63, nullable: true, description: Must be a valid S3 bucket name; omitted = derived from name and environment (also validated) }
      responses:
        "200": { description: Space created }
        "401": { description: Authentication required }
        "404": { description: Application not found }
        "409": { description: "Duplicate (application_id, name, environment), inactive application, or bucket name already in use" }
        "422": { description: Invalid bucket name }
    get:
      summary: List spaces (admin:read)
      tags: [platform]
      responses:
        "200": { description: Spaces }
        "401": { description: Authentication required }
  /api/v1/admin/identities:
    post:
      summary: Create a machine-to-machine identity (admin:write)
      tags: [identities]
      description: The token is returned exactly once; only its fingerprint is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [space_id, name]
              properties:
                space_id: { $ref: "#/components/schemas/Uuid4" }
                name: { type: string, minLength: 1, maxLength: 63 }
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [objects:read, objects:write, objects:delete, objects:purge]
                ttl_seconds: { type: integer, minimum: 1, nullable: true }
      responses:
        "200": { description: Identity created; response contains the one-time token }
        "401": { description: Authentication required }
        "404": { description: Space not found }
        "422": { description: "Unknown scope, or an admin scope requested for a service identity" }
    get:
      summary: List identities without secrets (admin:read)
      tags: [identities]
      parameters:
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
      responses:
        "200": { description: Identity metadata (never secret material) }
        "401": { description: Authentication required }
  /api/v1/admin/identities/{iid}/rotate:
    post:
      summary: Rotate an identity secret (admin:write)
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "200": { description: New one-time token; old secret invalid immediately }
        "401": { description: Authentication required }
        "404": { description: Identity not found or revoked }
  /api/v1/admin/identities/{iid}/revoke:
    post:
      summary: Revoke an identity (admin:write)
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "200": { description: Identity revoked }
        "401": { description: Authentication required }
        "404": { description: Identity not found }
  /api/v1/admin/applications/{aid}:
    get:
      summary: Application detail with its stable id and space count (admin:read)
      tags: [platform]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200": { description: "Application with name, status, stable id and space count" }
        "401": { description: Authentication required }
        "404": { description: Application not found }
        "422": { description: Identifier is not a canonical UUID v4 }
    patch:
      summary: Rename or activate/deactivate an application (admin:write)
      tags: [platform]
      description: >-
        Soft lifecycle only: an application is never deleted. Deactivating it
        blocks new spaces from being attached while existing ones stay readable.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: Application updated }
        "401": { description: Authentication required }
        "404": { description: Application not found }
        "409": { description: Application name already exists }
        "422": { description: "No field, an explicit null, or an invalid status" }
  /api/v1/admin/spaces/{sid}:
    get:
      summary: Space detail with buckets and attachment counts (admin:read)
      tags: [platform]
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200": { description: "Space with its application, buckets and counts" }
        "401": { description: Authentication required }
        "404": { description: Space not found }
        "422": { description: Identifier is not a canonical UUID v4 }
    patch:
      summary: Rename, re-environment or activate/deactivate a space (admin:write)
      tags: [platform]
      description: >-
        `application_id` is immutable — a space is never moved to another
        application. `name`/`environment` must stay unique within the
        application. Deactivating a space refuses new uploads and new identities
        while keeping existing rows readable.
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
                environment: { type: string, minLength: 1, maxLength: 32 }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: Space updated }
        "401": { description: Authentication required }
        "404": { description: Space not found }
        "409": { description: "Duplicate (application_id, name, environment)" }
        "422": { description: "No field, an explicit null, or an invalid status" }
  /api/v1/admin/spaces/{sid}/buckets:
    post:
      summary: Register an additional bucket for a space (admin:write)
      tags: [platform]
      description: >-
        Additive and non-destructive: the bucket is created in the catalogue and
        the S3 name rules are enforced. It is not made the default here and no
        bucket is ever deleted through the API.
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  description: Must be a valid S3 bucket name.
      responses:
        "200": { description: Bucket registered (not the space default) }
        "401": { description: Authentication required }
        "404": { description: Space not found }
        "409": { description: Bucket name already in use }
        "422": { description: Invalid bucket name }
  /api/v1/admin/buckets:
    get:
      summary: List every bucket with its space/application attachment (admin:read)
      tags: [platform]
      responses:
        "200": { description: Buckets and their attachment; never any S3 credential }
        "401": { description: Authentication required }
  /api/v1/admin/buckets/{bid}:
    patch:
      summary: Set or clear a bucket's default flag (admin:write)
      tags: [platform]
      description: >-
        Setting a bucket default clears the flag on the other buckets of the
        same space, so exactly one default is possible. Existing objects keep
        their own bucket locator, so the change is reversible.
      parameters:
        - $ref: "#/components/parameters/BucketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_default]
              properties:
                is_default: { type: boolean }
      responses:
        "200": { description: Bucket default flag updated }
        "401": { description: Authentication required }
        "404": { description: Bucket not found }
        "422": { description: Invalid or missing body field }
  /api/v1/objects/bulk-purge:
    post:
      summary: "Permanently delete several trashed objects in one call (objects:purge, human, master mode)"
      tags: [objects]
      responses:
        "200": { description: "Per-object outcome" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "422": { description: "Invalid identifier list or too many objects" }
  /api/v1/objects/trash/empty:
    post:
      summary: "Permanently delete everything in the caller's trash (objects:purge, human, master mode)"
      tags: [objects]
      responses:
        "200": { description: "Trash emptied; per-object outcome" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/objects/{oid}/restore:
    post:
      summary: "Restore a soft-deleted object from the trash (objects:delete)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Object restored" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "404": { description: "Object not found or not visible" }
        "409": { description: "Object is not in the trash" }
  /api/v1/objects/{oid}/multipart:
    get:
      summary: "Multipart upload state: parts already held by the storage, for resuming (objects:write)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Plan and uploaded parts" }
        "401": { description: "Authentication required" }
        "404": { description: "Object not found, or not a multipart upload" }
  /api/v1/objects/{oid}/multipart/parts:
    post:
      summary: "Presigned URLs for a batch of multipart parts (objects:write)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Presigned part URLs" }
        "401": { description: "Authentication required" }
        "404": { description: "Object not found or not a multipart upload" }
        "422": { description: "Invalid part numbers" }
  /api/v1/objects/{oid}/share:
    post:
      summary: "Create a share link for an object; the token is returned once (objects:read, human)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Share link and one-time token" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "404": { description: "Object not found or not visible" }
        "409": { description: "Object not available" }
        "422": { description: "Invalid expiry or use limit" }
  /api/v1/objects/{oid}/shares:
    get:
      summary: "List the share links of an object (objects:read)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "Share links without their tokens" }
        "401": { description: "Authentication required" }
        "404": { description: "Object not found or not visible" }
  /api/v1/objects/{oid}/shares/{sid}:
    delete:
      summary: "Revoke a share link (objects:read, human)"
      tags: [objects]
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - { in: path, name: sid, required: true, schema: { $ref: "#/components/schemas/Uuid4" } }
      responses:
        "200": { description: "Share revoked" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "404": { description: "Share not found or not visible" }
  /api/v1/me/master-mode:
    post:
      summary: "Enter master mode after re-entering the password: bulk purges without a per-item confirmation for a limited time (objects:purge, human)"
      tags: [auth]
      responses:
        "200": { description: "Master mode active until the returned expiry" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "422": { description: "Missing or wrong password" }
    delete:
      summary: "Leave master mode"
      tags: [auth]
      responses:
        "200": { description: "Master mode ended" }
        "401": { description: "Authentication required" }
  /api/v1/admin/integrity:
    get:
      summary: "Periodic integrity scrub report: results, oldest check and problem objects (admin:read)"
      tags: [administration]
      responses:
        "200": { description: "Integrity summary" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/admin/integrity/scrub:
    post:
      summary: "Run one bounded integrity scrub pass now (admin:write)"
      tags: [administration]
      responses:
        "200": { description: "Pass counters" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/admin/reconcile-reverse:
    post:
      summary: "Find catalogue objects missing at the storage (reverse reconciliation) (admin:write)"
      tags: [administration]
      responses:
        "200": { description: "Findings" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/admin/reconcile-terminal:
    post:
      summary: "Delete storage bytes left by objects in a terminal state (admin:write)"
      tags: [administration]
      responses:
        "200": { description: "Cleanup counters" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/admin/storage-orphans:
    get:
      summary: "List storage objects that no catalogue row references (admin:read)"
      tags: [administration]
      responses:
        "200": { description: "Orphan keys older than the grace period" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
  /api/v1/admin/storage-orphans/cleanup:
    post:
      summary: "Delete selected storage orphans (admin:write)"
      tags: [administration]
      responses:
        "200": { description: "Per-key outcome" }
        "401": { description: "Authentication required" }
        "403": { description: "Not authorised" }
        "422": { description: "Invalid key list" }
components:
  schemas:
    Uuid4:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: >-
        Canonical identifier: a canonical UUID v4 (lowercase, 8-4-4-4-12).
        Alternate spellings are normalized; anything else is refused with 422.
        See docs/DATA-MODEL.md.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: >-
            Double-submit CSRF token, to send as `X-CSRF-Token` on every mutating
            call. The session itself is the HttpOnly `aura_session` cookie set by
            the same response; it is never part of the body.
    Principal:
      type: object
      required: [id, kind, role]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        kind: { type: string, enum: [user, service] }
        name: { type: [string, "null"], description: Username (human) or identity name (service) }
        role: { type: string, enum: [user, operator, admin, service] }
        space_id: { $ref: "#/components/schemas/Uuid4" }
        application_id: { $ref: "#/components/schemas/Uuid4" }
        scopes:
          type: array
          items: { type: string }
          description: Effective capabilities; empty for a human session (the role map decides)
        csrf_token:
          type: [string, "null"]
          description: Always null for a service (Bearer) principal
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required: [display_name, size_bytes]
      properties:
        bucket: { type: string, maxLength: 63 }
        display_name: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, maxLength: 127, default: application/octet-stream }
        size_bytes: { type: integer, minimum: 0 }
        folder_id: { $ref: "#/components/schemas/Uuid4" }
    UploadIntent:
      type: object
      required: [id, status, method, upload_url, headers, content_type, size_bytes]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        status: { type: string, enum: [pending] }
        method: { type: string, enum: [PUT] }
        upload_url:
          type: string
          description: >-
            Presigned S3 URL. PUT the bytes there directly — the API never proxies
            them. It is bound to Content-Length, the content type and SSE-S3.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers the client must send with the presigned PUT (both are signed)
        content_type: { type: string }
        size_bytes: { type: integer }
        expires_in: { type: integer, description: Seconds of validity }
        expires_at: { type: integer, description: Epoch seconds }
        idempotent_replay:
          type: boolean
          description: True when a repeated Idempotency-Key returned this same pending intent
    CommitResult:
      type: object
      required: [id, status, size_bytes, checksum_sha256, checksum_algorithm]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        status: { type: string, enum: [available] }
        size_bytes: { type: integer }
        checksum_sha256: { type: string, description: Hex SHA-256 streamed server-side }
        checksum_algorithm: { type: string, enum: [sha256] }
        commit_timing:
          type: [object, "null"]
          description: >-
            Durations of the commit phases, in milliseconds. The property is
            absent when the object was already available, so no commit was
            performed here, and null when the commit was won by a concurrent
            request, whose phases were therefore not measured here.
          properties:
            head_ms: { type: number, description: Time spent reading the object metadata }
            hash_ms: { type: number, description: Time spent streaming and hashing the body }
            total_ms: { type: number, description: Total duration of the commit }
    ObjectSummary:
      type: object
      required: [id, display_name, content_type, size_bytes, status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        display_name: { type: string }
        content_type: { type: string }
        size_bytes:
          type: integer
          description: Committed size; -1 while the upload is only pending
        expected_size_bytes: { type: [integer, "null"], description: Declared size at intent time }
        checksum_sha256: { type: [string, "null"] }
        checksum_algorithm: { type: string, enum: [sha256] }
        status:
          type: string
          enum: [pending, available, deleted, expired, failed, aborted]
        folder_id: { $ref: "#/components/schemas/Uuid4" }
        created_at: { type: integer }
        updated_at: { type: integer }
    Folder:
      type: object
      required: [id, name, parent_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        name: { type: string }
        parent_id: { $ref: "#/components/schemas/Uuid4" }
        created_at: { type: integer }
    FolderCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parent_id: { $ref: "#/components/schemas/Uuid4" }
    Stats:
      type: object
      required: [objects_by_status, applications, spaces, buckets, service_identities]
      properties:
        objects_by_status:
          type: object
          additionalProperties: { type: integer }
          description: Count per catalogue status (only statuses that occur)
        applications: { type: integer }
        spaces: { type: integer }
        buckets: { type: integer }
        service_identities: { type: integer }
        active_service_identities: { type: integer }
    BulkPurgeResult:
      type: object
      required: [purged, not_found, failed]
      properties:
        purged: { type: array, items: { $ref: "#/components/schemas/Uuid4" } }
        not_found:
          type: array
          items: { type: string }
          description: Unknown, out-of-scope or malformed ids
        failed:
          type: array
          items: { $ref: "#/components/schemas/Uuid4" }
          description: Storage delete failed; the catalogue row is kept
        more: { type: boolean, description: True when the trash still holds soft-deleted rows (empty-trash only) }
    MasterModeState:
      type: object
      required: [master_until]
      properties:
        master_until:
          type: [integer, "null"]
          description: Epoch seconds at which master mode expires; null when inactive
    MultipartStatus:
      type: object
      required: [id, size_bytes, part_size_bytes, part_count, uploaded_parts]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        size_bytes: { type: integer, description: Declared total size }
        part_size_bytes: { type: integer, description: Planned size of each part except the last }
        part_count: { type: integer }
        uploaded_parts:
          type: array
          items: { type: integer }
          description: Part numbers already stored at the planned size
    MultipartPartBatch:
      type: object
      required: [id, expires_in, parts]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        expires_in: { type: integer, description: Seconds of validity of every URL in this batch }
        parts:
          type: array
          items:
            type: object
            required: [part_number, size_bytes, url]
            properties:
              part_number: { type: integer }
              size_bytes: { type: integer, description: Exact byte length this part must carry }
              url: { type: string, description: Presigned PUT URL for this part }
    ObjectShareCreated:
      type: object
      required: [id, object_id, url, token, expires_in, expires_at, max_uses, content_disposition]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        object_id: { $ref: "#/components/schemas/Uuid4" }
        url: { type: string, description: "Path (/s/<token>) or absolute URL when AURA_SHARE_BASE_URL is configured" }
        token:
          type: string
          description: Returned exactly once; the catalogue keeps only its SHA-256 fingerprint
        expires_in: { type: integer }
        expires_at: { type: integer, description: Epoch seconds }
        max_uses: { type: [integer, "null"], description: Use ceiling; null = unlimited }
        content_disposition: { type: string, enum: [attachment, inline] }
    ObjectShare:
      type: object
      required: [id, object_id, created_by, created_by_kind, content_disposition, created_at, expires_at, max_uses, use_count, active]
      properties:
        id: { $ref: "#/components/schemas/Uuid4" }
        object_id: { $ref: "#/components/schemas/Uuid4" }
        created_by: { $ref: "#/components/schemas/Uuid4" }
        created_by_kind: { type: string, enum: [user, service] }
        content_disposition: { type: string, enum: [attachment, inline] }
        created_at: { type: integer }
        expires_at: { type: integer }
        max_uses: { type: [integer, "null"] }
        use_count: { type: integer }
        last_used_at: { type: [integer, "null"] }
        revoked_at: { type: [integer, "null"] }
        active:
          type: boolean
          description: Computed server-side from expiry, use count and revocation
  parameters:
    ObjectId:
      in: path
      name: oid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    IdentityId:
      in: path
      name: iid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    FolderId:
      in: path
      name: fid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    ApplicationId:
      in: path
      name: aid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    SpaceId:
      in: path
      name: sid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    BucketId:
      in: path
      name: bid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    ShareId:
      in: path
      name: sid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aura_session
      description: HttpOnly human session cookie; mutations also require the X-CSRF-Token header.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "AURA service token (aura_<id>_<secret>)"
