openapi: 3.1.0
info:
  title: AURA Management API
  version: 0.1.0
  description: Proposed contract only. This API is not implemented yet.
servers:
  - url: https://api-storage.example.com
paths:
  /health/live:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Service and required dependencies are ready
        "503":
          description: Service is not ready
  /api/v1/objects:
    get:
      summary: List/search authorised object metadata
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: folderId
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Page of authorised object metadata
        "401":
          description: Authentication required
        "403":
          description: Access denied
  /api/v1/objects/upload-intents:
    post:
      summary: Create a short-lived upload intent
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Upload intent created
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Not authorised
  /api/v1/objects/{id}:
    get:
      summary: Get object metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Object metadata
        "404":
          description: Object not found or not visible
    delete:
      summary: Soft-delete an object
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Deletion accepted
        "404":
          description: Object not found or not visible
  /api/v1/objects/{id}/download-intent:
    post:
      summary: Create a short-lived download intent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Download intent created
        "403":
          description: Not authorised
        "404":
          description: Object not found or not visible
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
