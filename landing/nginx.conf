# AURA landing page served on the S3 hostname for the anonymous `GET /` only.
# The guarded Traefik router (docker-compose.yml, service `s3-landing`) decides
# what reaches this server; everything else on the S3 host stays with SeaweedFS.
# Static assets only: no proxying, no JavaScript, no directory listing.
server {
  listen 80;
  server_name _;

  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src data:" always;

  location = / {
    try_files /index.html =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
